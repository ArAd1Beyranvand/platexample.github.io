  # Not a dependency this app names — it reaches it through the country
  # packages, every one of which takes its digit and letter alphabets from it.
  # It still needs an override: the country packages above are themselves
  # overridden to sibling checkouts, and a path dependency of an overridden
  # package is not resolved from that checkout's own pubspec, so without this
  # entry `package:plate_alphabet/...` is missing from this app's package
  # config and every country package fails to compile.
  plate_alphabet:
    path: ../plate_alphabet

flutter:
  uses-material-design: true

  # Each family ships as per-script subsets, and the `-latin-ext` file holds
  # ONLY the Latin Extended block — it has no A–Z at all. Declaring it alone
  # left every glyph to the system fallback, which has neither
  # the `wght`/`wdth` axes nor the metrics §2 is specified against, so cards
  # wrapped far taller than the design and collided. Every subset a family has
  # must be listed; Flutter falls through them glyph by glyph.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-latin.ttf
        - asset: assets/fonts/Archivo-latin-ext.ttf
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-latin.ttf
        - asset: assets/fonts/MartianMono-latin-ext.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-arabic.ttf
        - asset: assets/fonts/Vazirmatn-latin.ttf
        - asset: assets/fonts/Vazirmatn-latin-ext.ttf

