name: plate_number_holder
description: >-
  Showcase / poster app for the core_plate library. Lives outside the
  package repo so the library stays free of demo-only assets (fonts,
  textures, device-frame art) and demo-only dependencies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # The library under demonstration.
  #
  # PATH dependencies on sibling checkouts, so editing a library and
  # hot-reloading this app is a single loop — no publish, no `pub get` between
  # them. The split makes the libraries siblings of each other, not a
  # `packages/` directory inside one repo (see core-plate/docs/split/PLAN.md
  # §0). Path-only, not published (PLAN.md §6.6). Layout:
  #
  #   StudioProjects/plate/
  #     core-plate/             package `core_plate`   (the engine)
  #     plate-keypad/           package `plate_keypad`  (extracted in P7)
  #     iran-plate/             package `iran_plate`    (extracted in P8)
  #     germany-plate/          package `germany_plate` (extracted in P8)
  #     plate_number_holder/    this app (keeps its name — it is an app, not a package)
  #
  # core_plate ships no country and no assets, so this app names every country
  # it draws. An app that draws one country depends on one.
  # ---------------------------------------------------------------------------
  core_plate:
    path: ../core-plate

  # The optional on-screen keypad + slot picker, extracted from core_plate
  # in P7. Depends on core_plate for PlateAlphabet.
  plate_keypad:
    path: ../plate-keypad

  # The country packages, extracted from core_plate in P8. Each owns its own
  # plate specs, alphabets and flag/sticker assets, and depends on core_plate
  # and nothing else — not on the keypad, and not on each other.
  iran_plate:
    path: ../iran-plate
  germany_plate:
    path: ../germany-plate

  # Used directly by the showcase to drive PlateCardBloc from the demo screen.
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Poster-only artwork. These belong to the demo, not to the library — core
  # ships no assets at all since P8, and the assets a real plate needs (flag
  # SVGs, EU stickers) ship in iran_plate / germany_plate.
  assets:
    - assets/textures/bg_grain_a.png
    - assets/textures/bg_grain_b.png
    - assets/textures/tex_screen.png
    - assets/textures/tex_overlay.png

  # Each family ships as per-script subsets, and the `-latin-ext` file holds
  # ONLY the Latin Extended block — it has no A–Z at all. Declaring it alone
  # left every glyph in the poster to the system fallback, which has neither
  # the `wght`/`wdth` axes nor the metrics §2 is specified against, so cards
  # wrapped far taller than the design and collided. Every subset a family has
  # must be listed; Flutter falls through them glyph by glyph.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-latin.ttf
        - asset: assets/fonts/Archivo-latin-ext.ttf
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-latin.ttf
        - asset: assets/fonts/MartianMono-latin-ext.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-latin.ttf
        - asset: assets/fonts/Newsreader-latin-ext.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-arabic.ttf
        - asset: assets/fonts/Vazirmatn-latin.ttf
        - asset: assets/fonts/Vazirmatn-latin-ext.ttf
