name: plate_number_holder
description: >-
  Demo site for the plate_core library. Lives outside the package repo so
  the library stays free of demo-only assets (fonts) and demo-only
  dependencies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Web-only, and imported only behind a `dart.library.js_interop` conditional
  # export (lib/app/url_strategy/): it supplies `usePathUrlStrategy()`, which
  # is what makes the tabs plain paths instead of `#` fragments.
  flutter_web_plugins:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # The library under demonstration.
  #
  # PATH dependencies on sibling checkouts, so editing a library and
  # hot-reloading this app is a single loop — no publish, no `pub get` between
  # them. The split makes the libraries siblings of each other, not a
  # `packages/` directory inside one repo (see plate_core/docs/split/PLAN.md
  # §0). Path-only, not published (PLAN.md §6.6). Layout:
  #
  #   StudioProjects/plate/
  #     plate_core/             package `plate_core`   (the engine)
  #     plate_keypad/           package `plate_keypad`  (extracted in P7)
  #     iran_plate/             package `iran_plate`    (extracted in P8)
  #     palestine_plate/        package `palestine_plate`
  #     yemen_plate/            package `yemen_plate`
#     lebanon_plate/          package `lebanon_plate`
  #     plate_number_holder/    this app (keeps its name — it is an app, not a package)
  #
  # plate_core ships no country and no assets, so this app names every country
  # it draws. An app that draws one country depends on one.
  # ---------------------------------------------------------------------------
  plate_core: ^0.12.0

  # The optional on-screen keypad + slot picker, extracted from plate_core
  # in P7. Depends on plate_core for PlateAlphabet.
  plate_keypad:
    path: ../plate_keypad/flutter

  # The country packages, extracted from plate_core in P8. Each owns its own
  # plate specs, alphabets and flag/sticker assets, and depends on plate_core
  # and nothing else — not on the keypad, and not on each other.
