<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">

       viewport swaps mid-load and the splash jumps. -->

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter license plate widgets for dozens of countries: browse every plate type, try them live in the playground, and add a country package with one command.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="platexample">
  <meta property="og:title" content="platexample – license plates for Flutter">
  <meta property="og:description" content="Flutter license plate widgets for dozens of countries: browse every plate type, try them live in the playground, and add a country package with one command.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="platexample – license plates for Flutter">
  <meta name="twitter:description" content="Flutter license plate widgets for dozens of countries: browse every plate type, try them live in the playground, and add a country package with one command.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plate_number_holder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>platexample – license plates for Flutter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #161826;
      color: #e9e9ed;
      font-family: Inter, Vazirmatn, system-ui, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(60% 50% at 50% 45%, #1f2236 0%, #161826 70%);
      transition: opacity 0.5s ease, visibility 0.5s;
      z-index: 9999;
    }
    #splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-content {
      display: grid;
      justify-items: center;
      gap: 22px;
    }
    .plate {
      position: relative;
      display: flex;
      direction: ltr;
      width: 220px;
      height: 50px;
      border: 1.5px solid #3a3d55;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 40px -10px #9184d966;
    }
    .plate { zoom: 4; }
    @media (max-width: 940px) { .plate { zoom: 1.6; } }
    .plate:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, #9184d933 50%, transparent 70%);
      animation: splash-shine 1.8s ease-in-out infinite;
    }
    .plate-section {
      width: 26px;
      background: #1f3f9a;
      border-right: 1px solid #3a3d55;
      display: grid;
      grid-template-rows: auto 1fr;
      justify-items: center;
      align-items: start;
      padding-top: 5px;
      row-gap: 3px;
    }
    .plate-section i {
      width: 20px;
      height: 11.4px;
      background: url("assets/packages/iran_plate/assets/flags/Flag_of_Iran.svg") center / 100% 100% no-repeat;
    }
    .plate-section span {
      align-self: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .plate-number {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .plate-number b {
      font-weight: 500;
      color: #b5abf0;
    }
    .digit {
      display: inline-block;
      transition: opacity 0.25s, transform 0.25s;
    }
    .digit.fade {
      opacity: 0;
      transform: translateY(-6px);
    }
    .plate-region {
      width: 46px;
      border-left: 1px solid #3a3d55;
      display: grid;
      place-items: center;
      font-size: 17px;
      position: relative;
    }
    .plate-region small {
      position: absolute;
      top: 3px;
      font-size: 8px;
      color: #8b8ea6;
    }
    .progress-bar {
      width: 120px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #2a2d42 30%, #2a2d42 70%, transparent);
      overflow: hidden;
      position: relative;
    }
    .progress-bar:after {
      content: "";
      position: absolute;
      top: 0;
      width: 40%;
      height: 100%;
      background: #9184d9;
      box-shadow: 0 0 8px #9184d9;
      animation: splash-move 1.2s ease-in-out infinite;
    }
    .splash-label {
      font-size: 13px;
      color: #8b8ea6;
      letter-spacing: 0.02em;
    }

    @keyframes splash-shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes splash-move {
      0% { right: -40%; }
      100% { right: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plate:after, .progress-bar:after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="در حال بارگذاری">
    <div class="splash-content">
      <div class="plate" aria-hidden="true">
        <div class="plate-section"><i></i><span>IR</span></div>
        <div class="plate-number"><span class="digit">۱۲</span><b class="digit">ب</b><span class="digit">۳۴۵</span></div>
        <div class="plate-region"><small>ایران</small><span class="digit">۶۷</span></div>
      </div>
      <div class="progress-bar"></div>
      <div class="splash-label">پلاک گالری</div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function(){
      var fa="۰۱۲۳۴۵۶۷۸۹",L="بجدسصطقلمنوهی",ds=document.querySelectorAll('.digit'),k=0;
      function r(n){var s="";while(n--)s+=fa[Math.random()*10|0];return s}
      var gen=[function(){return r(2)},function(){return L[Math.random()*L.length|0]},function(){return r(3)},function(){return r(2)}];
      var iv=setInterval(function(){
        var i=k++%4,el=ds[i];el.classList.add('fade');
        setTimeout(function(){el.textContent=gen[i]();el.classList.remove('fade')},250);
      },420);
      function done(){var l=document.getElementById('splash');if(!l)return;clearInterval(iv);l.classList.add('splash-hidden');setTimeout(function(){l.remove()},600)}
      window.addEventListener('flutter-first-frame',done);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
