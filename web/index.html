<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plate_number_holder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>plate_number_holder</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Renders immediately, before Flutter's JS/wasm is even fetched. Palette
       matches lib/theme/nocturne.dart (N.bg/N.n900/N.n800/N.accent) and the
       ambient look of lib/poster/plate_backdrop.dart, so the handoff to the
       real app is a continuation rather than a swap. */
    html, body {
      margin: 0;
      height: 100%;
      background: #050608;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(124, 92, 255, 0.16) 0%, rgba(124, 92, 255, 0) 42%),
        radial-gradient(circle at 82% 78%, rgba(124, 92, 255, 0.14) 0%, rgba(124, 92, 255, 0) 46%),
        linear-gradient(135deg, #0e1219 0%, #232c42 55%, #050608 100%);
      transition: opacity 0.35s ease;
      z-index: 9999;
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* A stand-in for the real PlateCanvas: it can't paint until the Flutter
       engine boots, so this mimics its shape (white face, black keyline,
       two slot groups) rather than the actual widget. */
    #splash .plate {
      width: min(62vw, 260px);
      aspect-ratio: 220 / 108;
      background: #f4f6f9;
      border: 4px solid #14161a;
      border-radius: 10px;
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10%;
      padding: 0 8%;
    }
    #splash .plate .slot {
      flex: 1;
      height: 46%;
      border-radius: 3px;
      background: #14161a;
      opacity: 0.86;
    }
    #splash .plate .gap {
      width: 4%;
    }
    #splash .plate .slot.blink {
      animation: splash-blink 1.1s ease-in-out infinite;
    }

    #splash .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(234, 240, 251, 0.55);
    }

    @keyframes splash-blink {
      0%, 100% { opacity: 0.86; }
      50% { opacity: 0.12; background: #7c5cff; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="plate">
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="gap"></div>
      <div class="slot blink"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
    <div class="label">Loading</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
